name: Lint and Test

# Controls when the action will run.
on:
   # Triggers the workflow on push or pull request events but only for the master and develop branch
  push:
    branches:
     - develop
     - master
  pull_request:
    branches:
     - develop
     - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  python_code:
    name: check pycodestyle and unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # the newest python snakemake 7 runs on, it can't parse f-strings in .smk files on python 3.12+
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies tests
        run: |
          pip install -e .
          pip install -r requirements.test.txt
      - name: Check pycodestyle
        run: pycodestyle --max-line-length=140 --statistics ./
      - name: run pytest
        run: python -m pytest
